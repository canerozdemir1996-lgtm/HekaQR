name: Daily DB Backup

on:
  schedule:
    - cron: "0 2 * * *" # her gün 02:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client + age
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age awscli

      - name: Dump database (custom format)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$DATABASE_URL" -F c -f "backup_$(date +%Y%m%d).dump"

      - name: Encrypt with age
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          echo "$AGE_PUBLIC_KEY" > recipient.pub
          age -r "$(cat recipient.pub)" -o "backup_$(date +%Y%m%d).dump.age" "backup_$(date +%Y%m%d).dump"
          shred -u "backup_$(date +%Y%m%d).dump"

      - name: Upload to Backblaze B2 (S3-compatible)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APP_KEY }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: |
          aws s3 cp "backup_$(date +%Y%m%d).dump.age" \
            "s3://${B2_BUCKET}/db/$(date +%Y%m%d).dump.age" \
            --endpoint-url "$B2_ENDPOINT"
