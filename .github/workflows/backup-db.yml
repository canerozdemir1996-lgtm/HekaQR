name: Daily DB Backup

on:
  schedule:
    - cron: "0 2 * * *" # her gün 02:00 UTC
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Mark start time
        run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install postgresql-client-17 + age + awscli
        run: |
          sudo apt-get update
          sudo apt-get install -y age unzip curl ca-certificates
          # Ubuntu noble'ın varsayılan apt deposu postgresql-client 16 veriyor;
          # Supabase Postgres 17 çalıştırıyor ve pg_dump server'dan daha eski
          # bir client major version'ı ile çalışmayı reddediyor ("aborting
          # because of server version mismatch") — PGDG resmi deposundan v17
          # kuruluyor.
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo $VERSION_CODENAME)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          # ubuntu-latest runner image'ında AWS CLI genelde önceden kurulu
          # geliyor — --update bayrağı her iki durumda da çalışır.
          sudo ./aws/install --update
          rm -rf awscliv2.zip aws

      - name: Dump database (custom format)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" -F c -f "backup_$(date +%Y%m%d).dump"

      - name: Encrypt with age
        env:
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          echo "$AGE_PUBLIC_KEY" > recipient.pub
          age -r "$(cat recipient.pub)" -o "backup_$(date +%Y%m%d).dump.age" "backup_$(date +%Y%m%d).dump"
          shred -u "backup_$(date +%Y%m%d).dump"

      - name: Upload to Cloudflare R2 (S3-compatible)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp "backup_$(date +%Y%m%d).dump.age" \
            "s3://${R2_BUCKET}/db/$(date +%Y%m%d).dump.age" \
            --endpoint-url "$R2_ENDPOINT"
          echo "SIZE_BYTES=$(stat -c%s "backup_$(date +%Y%m%d).dump.age")" >> "$GITHUB_ENV"

      # Sonuç bildirimi — admin panelindeki /admin/backups sayfası bunu okur.
      # if: always() ile her durumda (önceki adımlardan biri başarısız olsa
      # bile) çalışır; status, o noktaya kadarki job durumuna göre seçilir.
      - name: Report result
        if: always()
        env:
          APP_URL: ${{ secrets.APP_URL }}
          BACKUP_REPORT_TOKEN: ${{ secrets.BACKUP_REPORT_TOKEN }}
        run: |
          STATUS="success"
          if [ "${{ job.status }}" != "success" ]; then STATUS="failed"; fi
          curl -sfL -X POST "$APP_URL/api/internal/backups/report" \
            -H "Content-Type: application/json" \
            -H "X-Backup-Token: $BACKUP_REPORT_TOKEN" \
            -d "{\"kind\":\"db\",\"status\":\"$STATUS\",\"started_at\":\"$STARTED_AT\",\"size_bytes\":${SIZE_BYTES:-null}}" \
            || echo "::warning::Backup report gönderilemedi"
